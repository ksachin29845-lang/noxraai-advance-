  <script>
    const OWNER_ADMIN_EMAIL = "ksachin29845@gmail.com";
    const STORAGE_KEY = "noxra_ai_web_state_v2";

    const DEFAULT_STATE = {
      currentUser: null,
      users: [
        { name: "Aarav Sharma", username: "aarav_top", email: "aarav@student.in", studentClass: "Class 9", xp: 1480, streak: 19, tier: "Hard", pass: true },
        { name: "Diya Verma", username: "diya_math", email: "diya@student.in", studentClass: "Class 8", xp: 1290, streak: 14, tier: "Medium", pass: true },
        { name: "Rohan Gupta", username: "rohan_eng", email: "rohan@student.in", studentClass: "Class 7", xp: 980, streak: 9, tier: "Medium", pass: false },
        { name: "Ananya Singh", username: "ananya_pro", email: "ananya@student.in", studentClass: "Class 10", xp: 840, streak: 7, tier: "Basic", pass: false },
        { name: "Kabir Patel", username: "kabir_xp", email: "kabir@student.in", studentClass: "Class 6", xp: 620, streak: 5, tier: "Basic", pass: false }
      ],
      devInfo: {
        name: "Sachin Kumar",
        age: "12 Years",
        role: "CEO, Founder & Owner of Noxra AI",
        bio: "Young innovator building smart English, Math & AI education tools so every student can practice from Basic to Hard levels with confidence."
      },
      activeTab: "home",
      activeSubject: "English",
      aiSessions: [],
      currentAiMessages: [
        { role: "ai", text: "Hi! I am Noxra AI ✨ Ask me any English grammar, vocabulary, or Math step-by-step question!" }
      ],
      friendChats: {}
    };

    let state = loadState();
    let activeQuiz = null;
    let slideIndex = 0;

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return structuredClone(DEFAULT_STATE);
        const parsed = JSON.parse(raw);
        return { ...structuredClone(DEFAULT_STATE), ...parsed };
      } catch (e) {
        return structuredClone(DEFAULT_STATE);
      }
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    function isOwner() {
      return state.currentUser &&
        state.currentUser.email &&
        state.currentUser.email.trim().toLowerCase() === OWNER_ADMIN_EMAIL;
    }

    function switchTab(tab) {
      state.activeTab = tab;
      saveState();
      render();
    }

    function render() {
      const root = document.getElementById("app");
      const nav = document.getElementById("bottomNav");

      if (!state.currentUser) {
        nav.classList.add("hidden");
        root.innerHTML = renderAuth();
        return;
      }

      nav.classList.remove("hidden");
      ["home", "learn", "practice", "compete", "ai"].forEach(id => {
        const btn = document.getElementById("nav-" + id);
        if (btn) btn.classList.toggle("active", state.activeTab === id);
      });

      if (state.activeTab === "home") root.innerHTML = renderHome();
      else if (state.activeTab === "learn") root.innerHTML = renderLearn();
      else if (state.activeTab === "practice") root.innerHTML = renderPractice();
      else if (state.activeTab === "compete") root.innerHTML = renderCompete();
      else if (state.activeTab === "ai") root.innerHTML = renderAi();
    }

    function renderAuth() {
      const params = new URLSearchParams(window.location.search);
      const urlUser = (params.get("u") || "").trim().replace(/^@/, "").toLowerCase();
      const initialQ = (params.get("q") || urlUser || "").trim();
      const matchedProfile = urlUser ? state.users.find(u => u.username.toLowerCase() === urlUser) : null;

      return `
        <div class="card hero-card" style="text-align:center; padding:24px 18px;">
          <div class="logo-badge" style="margin:0 auto 12px; width:64px; height:64px; font-size:28px;">N</div>
          <h1>Noxra AI</h1>
          <p style="margin-top:6px;">English &amp; Math Levels 1–50 • Basic, Medium &amp; Hard • Live Ranked Leagues • Smart AI Tutor</p>
        </div>

        ${matchedProfile ? `
          <div class="card" style="border-color: var(--primary);">
            <span class="pill" style="margin-bottom:8px;">🌐 Public Student Profile</span>
            <h2>${escapeHtml(matchedProfile.name)} (@${escapeHtml(matchedProfile.username)})</h2>
            <p>${escapeHtml(matchedProfile.studentClass)} • ⭐ ${matchedProfile.xp} XP • 🔥 ${matchedProfile.streak}d Streak • ${escapeHtml(matchedProfile.tier)} Tier</p>
          </div>
        ` : ""}

        <div class="card">
          <h2>🔍 Search Public Noxra AI Directory</h2>
          <p style="margin-bottom:8px;">Search courses, AI tools, founder profile, or public @username learners — just like Google:</p>
          <div class="row">
            <input id="publicSearchInp" value="${escapeHtml(initialQ)}" placeholder="Search @aarav_top, English 1-50, Math, Sachin Kumar..." style="margin:0;" oninput="runPublicWebSearch(this.value)" />
            <button class="btn btn-ghost" onclick="copyPublicShareUrl()">Share Link</button>
          </div>
          <div id="publicSearchOut" style="margin-top:10px;">${buildPublicSearchHtml(initialQ)}</div>
        </div>

        <div class="card">
          <h2>Complete Registration / Sign In</h2>
          <p style="margin-bottom:14px;">Fill all student details once — your account stays signed in automatically on this device.</p>

          <label>Full Name *</label>
          <input id="regName" placeholder="e.g. Aarav Kumar" />

          <label>Student Email *</label>
          <input id="regEmail" type="email" placeholder="student@gmail.com" />

          <div class="grid-2">
            <div>
              <label>Unique @username *</label>
              <input id="regUser" placeholder="aarav_01" />
            </div>
            <div>
              <label>Age *</label>
              <input id="regAge" type="number" placeholder="12" value="12" />
            </div>
          </div>

          <div class="grid-2">
            <div>
              <label>Select Class *</label>
              <select id="regClass">
                ${["Class 1","Class 2","Class 3","Class 4","Class 5","Class 6","Class 7","Class 8","Class 9","Class 10","Class 11","Class 12"]
                  .map(c => `<option value="${c}" ${c==="Class 8"?"selected":""}>${c}</option>`).join("")}
              </select>
            </div>
            <div>
              <label>Starting Level *</label>
              <select id="regTier">
                <option value="Basic">Basic</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
              </select>
            </div>
          </div>

          <label>Passcode / Password (4+ chars) *</label>
          <input id="regPass" type="password" placeholder="Create or enter passcode" />

          <div id="authErr" style="color:#fda4af; font-size:13px; margin-bottom:10px;"></div>

          <button class="btn btn-primary" onclick="handleRegisterOrLogin()">🚀 Start Noxra AI</button>
        </div>

        <div class="card row">
          <div>
            <h3>👨‍💻 Developer: ${escapeHtml(state.devInfo.name)}</h3>
            <p>${escapeHtml(state.devInfo.role)} • Age: ${escapeHtml(state.devInfo.age)}</p>
          </div>
          <button class="btn btn-ghost" onclick="openDevModal()">About</button>
        </div>
      `;
    }

    function handleRegisterOrLogin() {
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const username = document.getElementById("regUser").value.trim().replace(/^@/, "").toLowerCase();
      const age = parseInt(document.getElementById("regAge").value.trim() || "0", 10);
      const studentClass = document.getElementById("regClass").value;
      const tier = document.getElementById("regTier").value;
      const pass = document.getElementById("regPass").value.trim();
      const err = document.getElementById("authErr");

      if (!name || !email || !username || age < 4 || pass.length < 4) {
        err.textContent = "Please fill all required fields (Name, Email, @username, Age, and 4+ character Passcode).";
        return;
      }

      const existing = state.users.find(u => u.username === username || u.email.toLowerCase() === email.toLowerCase());
      const userObj = existing ? {
        ...existing,
        name, email, username, age, studentClass, tier
      } : {
        name, email, username, age, studentClass, tier,
        xp: 120, streak: 1, gems: 150, hearts: 5,
        englishLevel: 1, mathLevel: 1,
        englishTier: tier, mathTier: tier,
        pass: false,
        history: [`Registered Noxra AI account (${studentClass} • ${tier}) — Admin notification queued for ${OWNER_ADMIN_EMAIL}`]
      };

      if (!existing) {
        state.users.push(userObj);
      }
      state.currentUser = userObj;
      saveState();
      render();
      openWelcomeSlideshow(userObj);
    }

    function renderHome() {
      const u = state.currentUser;
      return `
        <div class="card">
          <div class="row">
            <div class="row" style="justify-content:flex-start;">
              <div class="logo-badge">N</div>
              <div>
                <h2 style="margin:0;">Hi, ${escapeHtml(u.name)} 👋</h2>
                <p>@${escapeHtml(u.username)} • ${escapeHtml(u.studentClass)} • ${u.pass ? "🔥 Naruto ₹49 VIP" : "Standard Learner"}</p>
              </div>
            </div>
            <button class="btn btn-danger" onclick="confirmLogout()">Log Out</button>
          </div>
          <div class="row" style="margin-top:12px; flex-wrap:wrap;">
            <span class="pill">🔥 ${u.streak}d Streak</span>
            <span class="pill">⭐ ${u.xp} XP</span>
            <span class="pill">💎 ${u.gems || 150} Gems</span>
            <span class="pill">❤️ ${u.pass ? "∞" : (u.hearts ?? 5)}</span>
          </div>
        </div>

        <div class="card">
          <div class="row" style="margin-bottom:10px;">
            <div>
              <h2>⚡ Noxra AI Command Hub</h2>
              <p>Select any feature below • Progress auto-saved</p>
            </div>
            <button class="btn btn-ghost" onclick="openWelcomeSlideshow()">🎬 Welcome</button>
          </div>

          <div class="grid-2">
            <div class="tile" onclick="openSubjectLevels('English')">
              <h3>🇬🇧 English 1–50</h3>
              <p>${u.studentClass} • ${u.englishTier || u.tier} • Lv.${u.englishLevel || 1}/50</p>
            </div>
            <div class="tile" onclick="openSubjectLevels('Math')">
              <h3>➗ Math 1–50 + AI</h3>
              <p>${u.studentClass} • ${u.mathTier || u.tier} • Lv.${u.mathLevel || 1}/50</p>
            </div>
            <div class="tile" onclick="switchTab('ai')">
              <h3>✨ Noxra AI Tutor</h3>
              <p>Simple AI Chat + History</p>
            </div>
            <div class="tile" onclick="openFriendModal()">
              <h3>💬 Friend Chat</h3>
              <p>Search @username & Chat</p>
            </div>
            <div class="tile" onclick="openHistoryModal()">
              <h3>📜 App History</h3>
              <p>${(u.history || []).length} saved events</p>
            </div>
            <div class="tile" onclick="openDevModal()">
              <h3>👨‍💻 Developer Info</h3>
              <p>${escapeHtml(state.devInfo.name)} (${escapeHtml(state.devInfo.age)})</p>
            </div>
          </div>
        </div>

        <div class="card naruto-card">
          <div class="row">
            <div>
              <h2>🍥 Naruto Event Pass — ₹49</h2>
              <p>${u.pass ? "✅ Active! 2x XP Boost + Unlimited Hearts unlocked!" : "Unlock 2x XP Boost, Unlimited Hearts & Ninja Badge for ₹49!"}</p>
            </div>
            ${u.pass ? `<span class="pill">VIP ✓</span>` : `<button class="btn btn-gold" style="width:auto;" onclick="activateNarutoPass()">Activate ₹49</button>`}
          </div>
        </div>

        <div class="card row">
          <div style="overflow:hidden;">
            <h3>🌐 Share This Web App Link</h3>
            <p style="white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${escapeHtml(window.location.href)}</p>
          </div>
          <button class="btn btn-ghost" onclick="copyCurrentUrl()">Copy Link</button>
        </div>
      `;
    }

    function renderLearn() {
      const u = state.currentUser;

    function generateSmartTutorReply(q) {
      const lower = q.toLowerCase();
      if (lower.includes("3x + 9 = 24") || lower.includes("solve")) {
        return "Step-by-step Math Solution ➗:\n1) Start with 3x + 9 = 24\n2) Subtract 9 from both sides → 3x = 15\n3) Divide both sides by 3 → x = 5 ✅";
      }
      if (lower.includes("tense")) {
        return "English Tenses Made Simple 🇬🇧:\n• Present: 'I study English every day.'\n• Past: 'I studied English yesterday.'\n• Future: 'I will study English tomorrow.'";
      }
      if (lower.includes("vocab")) {
        return "5 Power Vocabulary Words 📚:\n1) Resilient — quick to recover\n2) Eloquent — fluent & expressive\n3) Diligent — hardworking\n4) Precise — exact and accurate\n5) Innovate — create new ideas";
      }
      const mathMatch = q.match(/(-?\d+)\s*([\+\-\*\/])\s*(-?\d+)/);
      if (mathMatch) {
        const a = parseFloat(mathMatch[1]), op = mathMatch[2], b = parseFloat(mathMatch[3]);
        const ans = op === "+" ? a + b : op === "-" ? a - b : op === "*" ? a * b : (b !== 0 ? (a / b).toFixed(2) : "undefined");
        return `Calculated Answer ➗: ${a} ${op} ${b} = ${ans} ✅ Keep practicing to earn more XP!`;
      }
      return `Great question! Here is your Noxra AI breakdown ✨:\n• Key Concept: Break "${q}" into smaller steps.\n• Tip: Practice the matching Basic → Medium → Hard level in the Learn tab to lock this into memory!`;
    }

      `);

    function launchQuickDrill(subj, tier) {
      const lvl = Math.floor(Math.random() * 15) + 1;

      activeQuiz = { subj, tier, lvl, q, quick: true };
      showModal(`

        <p style="margin-bottom:12px;">💡 AI Hint: ${escapeHtml(q.hint)}</p>

        `).join("")}
        <button class="btn btn-ghost" style="width:100%; margin-top:6px;" onclick="closeModal()">Close</button>
      `);
    }

    function buildQuestion(subj, tier, lvl) {
      if (subj === "Math") {
        const mult = tier === "Basic" ? 2 : tier === "Medium" ? 5 : 9;
        const a = lvl * mult + 3;
        const b = mult + 4;
        const ans = tier === "Hard" ? a * b : a + b;
        const sym = tier === "Hard" ? "×" : "+";
        const opts = [String(ans), String(ans + 4), String(ans - 3), String(ans + 9)];
        return {
          prompt: `Solve: ${a} ${sym} ${b} = ?`,
          hint: tier === "Hard" ? `Break ${a} × ${b} into tens and ones.` : `Add ${a} and ${b} carefully.`,
          options: opts,
          correct: 0
        };
      }
      const bank = {
        Basic: { prompt: `Choose the correct sentence (Level ${lvl}):`, hint: "Singular subject 'She' takes 'speaks'.", options: ["She speaks English fluently.", "She speak English fluently.", "She speaking English.", "She spoken English."], correct: 0 },
        Medium: { prompt: `Fill the blank (Level ${lvl}): "Neither Aarav nor his friends ___ late."`, hint: "Match verb with the nearer plural noun 'friends'.", options: ["were", "was", "is", "be"], correct: 0 },
        Hard: { prompt: `Choose the closest meaning of 'Eloquent' (Level ${lvl}):`, hint: "Used for powerful, fluent speakers.", options: ["Fluent and persuasive in speaking", "Very silent and shy", "Careless with grammar", "Slow to understand"], correct: 0 }
      };
      return bank[tier] || bank.Basic;
    }

    function submitAnswer(idx) {
      if (!activeQuiz) return;
      const u = state.currentUser;
      if (idx === activeQuiz.q.correct) {
        const baseXp = activeQuiz.tier === "Hard" ? 50 : activeQuiz.tier === "Medium" ? 35 : 25;
        const gained = u.pass ? baseXp * 2 : baseXp;
        u.xp = (u.xp || 0) + gained;
        u.gems = (u.gems || 150) + 10;
        if (!activeQuiz.quick) {
          if (activeQuiz.subj === "English" && activeQuiz.lvl === (u.englishLevel || 1) && u.englishLevel < 50) u.englishLevel++;
          if (activeQuiz.subj === "Math" && activeQuiz.lvl === (u.mathLevel || 1) && u.mathLevel < 50) u.mathLevel++;
        }
        logHistory(`Completed ${activeQuiz.subj} (${activeQuiz.tier}) Lv.${activeQuiz.lvl} • +${gained} XP`);
        syncCurrentUser();
        showModal(`

        showModal(`

            <div style="font-size:42px;">💡</div>

        `);
      }
    }

      const idx = state.users.findIndex(u => u.username === state.currentUser.username);
      if (idx >= 0) state.users[idx] = state.currentUser;
      else state.users.push(state.currentUser);
      saveState();
    }

    function showModal(html) {
      document.getElementById("modalRoot").innerHTML = `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
    }
    function closeModal() { document.getElementById("modalRoot").innerHTML = ""; }
    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;" }[c]));
    }

    function buildPublicSearchHtml(rawQuery) {
      const q = String(rawQuery || "").trim().toLowerCase().replace(/^@/, "");
      const catalog = [
        { title: "English Mastery Path (Levels 1–50)", sub: "Class 1–12 • Basic, Medium & Hard grammar & vocabulary", badge: "Course" },
        { title: "Math + AI Step Solver (Levels 1–50)", sub: "Arithmetic, fractions, algebra & word problems with AI hints", badge: "Course" },
        { title: `Founder: ${state.devInfo.name} (${state.devInfo.age})`, sub: state.devInfo.role + " — " + state.devInfo.bio, badge: "Founder" },
        ...state.users.map(u => ({
          title: `${u.name} (@${u.username})`,
          sub: `${u.studentClass} • ⭐ ${u.xp} XP • 🔥 ${u.streak}d Streak`,
          badge: "Learner"
        }))
      ];
      const filtered = q ? catalog.filter(item => item.title.toLowerCase().includes(q) || item.sub.toLowerCase().includes(q)) : catalog.slice(0, 4);
      if (filtered.length === 0) {
        return `<p>No local directory match for "${escapeHtml(rawQuery)}". <a href="https://www.google.com/search?q=${encodeURIComponent('Noxra AI ' + rawQuery)}" target="_blank" style="color:var(--primary);">Search on Google ↗</a></p>`;
      }
      return filtered.slice(0, 5).map(item => `
        <div class="rank-row">
          <div>
            <strong>${escapeHtml(item.title)}</strong>
            <div class="sub">${escapeHtml(item.sub)}</div>
          </div>
          <span class="pill">${escapeHtml(item.badge)}</span>
        </div>
      `).join("");
    }

    function runPublicWebSearch(val) {
      const out = document.getElementById("publicSearchOut");
      if (out) out.innerHTML = buildPublicSearchHtml(val);
    }

    function copyPublicShareUrl() {
      const inp = document.getElementById("publicSearchInp");
      const q = inp ? inp.value.trim() : "";
      const base = window.location.origin + window.location.pathname;
      const target = q ? `${base}?q=${encodeURIComponent(q)}` : window.location.href;
      navigator.clipboard?.writeText(target);
      alert("Public searchable link copied: " + target);
    }

    render();
  </script>
</body>
</html>
